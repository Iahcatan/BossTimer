name: Restore bot.py after accidental replacement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.event.head_commit.message == 'fix: harden custom boss loading against malformed Firebase values' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore bot.py from previous commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git commit -m 'restore: bot.py after accidental replacement'
          git push
