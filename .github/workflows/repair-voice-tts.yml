name: Repair Voice TTS and reconnect

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Iahcatan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          original = s

          old_tts = '''            # Give edge-tts an explicit session so aiohttp resources are always closed.\n            async with aiohttp.ClientSession() as tts_session:\n                for _, text, voice, filename, rate, pitch in tts_files:\n                    try:\n                        communicator = edge_tts.Communicate(\n                            text, voice, rate=rate, pitch=pitch, session=tts_session\n                        )\n                        await communicator.save(filename)\n                    except Exception as e:\n                        print(f"❌ สร้าง TTS ไม่สำเร็จ ({_}): {e}")\n'''
          new_tts = '''            # edge-tts 7.x manages its own HTTP session.\n            # Do NOT pass session=... to Communicate(); that argument was removed.\n            for _, text, voice, filename, rate, pitch in tts_files:\n                try:\n                    communicator = edge_tts.Communicate(\n                        text, voice, rate=rate, pitch=pitch\n                    )\n                    await communicator.save(filename)\n                except Exception as e:\n                    print(f"❌ สร้าง TTS ไม่สำเร็จ ({_}): {e}")\n'''
          if old_tts not in s:
              raise SystemExit('TTS block not found; refusing unsafe patch')
          s = s.replace(old_tts, new_tts, 1)

          marker = '''# ==========================================\n# 🔊 Event แจ้งเตือน + ทักทายเมื่อมีคนเข้าห้องเสียง\n# ==========================================\n'''
          listener = '''# ==========================================\n# 🔊 Voice reconnect guard\n# ==========================================\n@bot.listen("on_voice_state_update")\nasync def persistent_voice_reconnect(member: discord.Member, before: discord.VoiceState, after: discord.VoiceState):\n    """Keep /setvoice persistent if Discord drops the bot's voice session.\n\n    Normal discord.py voice reconnect remains enabled. This listener is only a\n    safety net after the bot itself disappears from the configured channel.\n    It never disconnects an active connection and never calls connect in a loop.\n    """\n    try:\n        if not bot.user or member.id != bot.user.id:\n            return\n        if before.channel is None or after.channel is not None:\n            return\n        if not get_configured_voice_channel(member.guild):\n            return\n\n        async def delayed_reconnect():\n            await asyncio.sleep(8)\n            vc = member.guild.voice_client\n            if vc and vc.is_connected():\n                return\n            try:\n                reconnected = await ensure_configured_voice(member.guild)\n                if reconnected and reconnected.is_connected():\n                    print(f"🔊 Voice reconnect สำเร็จ: {member.guild.name} -> {reconnected.channel.name}")\n                else:\n                    print(f"⚠️ Voice reconnect ยังไม่สำเร็จ: {member.guild.name}")\n            except Exception as exc:\n                print(f"⚠️ Voice reconnect error ({member.guild.name}): {exc!r}")\n\n        asyncio.create_task(delayed_reconnect())\n    except Exception as exc:\n        print(f"⚠️ persistent_voice_reconnect diagnostic failed: {exc!r}")\n\n'''
          if marker not in s:
              raise SystemExit('voice marker not found; refusing unsafe patch')
          if 'async def persistent_voice_reconnect(' not in s:
              s = s.replace(marker, listener + marker, 1)

          # The old /notice path is already correct: it calls speak_in_guild on the\n          # configured voice channel. Add a clearer diagnostic so failures are visible.\n          old_notice = '''    asyncio.create_task(speak_in_guild(interaction.guild, text_th=message))\n'''
          new_notice = '''    print(f"📢 /notice queued for voice: {interaction.guild.name} | message={message!r}")\n    asyncio.create_task(speak_in_guild(interaction.guild, text_th=message))\n'''
          if old_notice in s and '📢 /notice queued for voice' not in s:
              s = s.replace(old_notice, new_notice, 1)

          if s == original:
              raise SystemExit('No changes made')
          p.write_text(s, encoding='utf-8')
          print('bot.py patched successfully')
          PY

      - name: Validate Python syntax
        run: python -m py_compile bot.py start.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --check
          git commit -m "fix: repair edge-tts voice announcements and persistent voice reconnect" || exit 0
          git push

      - name: Remove this workflow after success
        if: success()
        run: |
          git rm .github/workflows/repair-voice-tts.yml || true
          git commit -m "chore: remove one-time voice tts patch workflow" || true
          git push || true
