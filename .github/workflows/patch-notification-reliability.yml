name: Patch notification reliability

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Iahcatan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch notification and TTS runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          # voice_patch.py: language flags must accept both bool and string values.
          p = Path('voice_patch.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('_watchdog_task = None\n', '_watchdog_task = None\n_notification_watchdog_task = None\n', 1)

          old_flags = '''        actual = []\n        if getattr(bot_module, "tts_th_enabled", True) and text_th:\n            actual.append(("th", text_th, getattr(bot_module, "VOICE_THAI", "th-TH-PremwadeeNeural"), "-20%", "+10Hz"))\n        if getattr(bot_module, "tts_en_enabled", True) and text_en:\n            actual.append(("en", text_en, getattr(bot_module, "VOICE_ENG", "en-US-AriaNeural"), "-10%", "+0Hz"))\n        if getattr(bot_module, "tts_ko_enabled", True) and text_ko:\n            actual.append(("ko", text_ko, getattr(bot_module, "VOICE_KOR", "ko-KR-SunHiNeural"), "-10%", "+0Hz"))\n'''
          new_flags = '''        actual = []\n\n        def language_enabled(attribute, default=True):\n            value = getattr(bot_module, attribute, default)\n            parser = getattr(bot_module, "parse_bool", None)\n            if callable(parser):\n                return parser(value, default)\n            return bool(value)\n\n        if language_enabled("tts_th_enabled", True) and text_th:\n            actual.append(("th", text_th, getattr(bot_module, "VOICE_THAI", "th-TH-PremwadeeNeural"), "-20%", "+10Hz"))\n        if language_enabled("tts_en_enabled", True) and text_en:\n            actual.append(("en", text_en, getattr(bot_module, "VOICE_ENG", "en-US-AriaNeural"), "-10%", "+0Hz"))\n        if language_enabled("tts_ko_enabled", True) and text_ko:\n            actual.append(("ko", text_ko, getattr(bot_module, "VOICE_KOR", "ko-KR-SunHiNeural"), "-10%", "+0Hz"))\n'''
          if old_flags not in s:
              raise SystemExit('voice_patch language block not found')
          s = s.replace(old_flags, new_flags, 1)

          old_interrupt = '''                    if vc.is_playing():\n                        vc.stop()\n                        await asyncio.sleep(0.15)\n\n'''
          if old_interrupt not in s:
              raise SystemExit('voice_patch playback interrupt block not found')
          s = s.replace(old_interrupt, '', 1)

          old_watchdog = '''    async def start_voice_watchdog():\n        global _watchdog_task\n        if _watchdog_task is None or _watchdog_task.done():\n            _watchdog_task = asyncio.create_task(voice_watchdog(), name="skynet-voice-watchdog")\n            log("🟢 Voice watchdog started")\n        return _watchdog_task\n'''
          new_watchdog = '''    async def notification_watchdog():\n        """Keep the existing bot.py notification loops alive.\n\n        bot.py remains the owner of Firebase, boss scheduling and notification\n        logic. This watchdog only restarts a discord.ext.tasks.Loop that has\n        stopped unexpectedly. It does not create a second scheduler.\n        """\n        task_names = (\n            "check_boss_notifications",\n            "check_bf_notifications",\n            "check_library_boss_notifications",\n        )\n        logged_missing = set()\n        while True:\n            try:\n                await asyncio.sleep(30)\n                if not bot_module.bot.is_ready():\n                    continue\n                for name in task_names:\n                    loop_obj = getattr(bot_module, name, None)\n                    if loop_obj is None:\n                        if name not in logged_missing:\n                            log(f"⚠️ Notification task not found: {name}")\n                            logged_missing.add(name)\n                        continue\n                    try:\n                        running = loop_obj.is_running() if hasattr(loop_obj, "is_running") else False\n                        if not running:\n                            log(f"🔄 Restarting notification task: {name}")\n                            loop_obj.start()\n                            log(f"🟢 Notification task restarted: {name}")\n                        else:\n                            logged_missing.discard(name)\n                    except RuntimeError as exc:\n                        log(f"⚠️ Notification task restart skipped ({name}): {exc!r}")\n                    except Exception as exc:\n                        log(f"❌ Notification task watchdog failed ({name}): {exc!r}")\n            except asyncio.CancelledError:\n                raise\n            except Exception as exc:\n                log(f"⚠️ Notification watchdog loop error: {exc!r}")\n\n    async def start_voice_watchdog():\n        global _watchdog_task, _notification_watchdog_task\n        if _watchdog_task is None or _watchdog_task.done():\n            _watchdog_task = asyncio.create_task(voice_watchdog(), name="skynet-voice-watchdog")\n            log("🟢 Voice watchdog started")\n        if _notification_watchdog_task is None or _notification_watchdog_task.done():\n            _notification_watchdog_task = asyncio.create_task(\n                notification_watchdog(), name="skynet-notification-watchdog"\n            )\n            log("🟢 Notification watchdog started")\n        return _watchdog_task\n'''
          if old_watchdog not in s:
              raise SystemExit('voice_patch watchdog block not found')
          s = s.replace(old_watchdog, new_watchdog, 1)
          p.write_text(s, encoding='utf-8')

          # bot.py: remove the latent edge-tts session= bug from the source too.
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          old_tts = '''            # Give edge-tts an explicit session so aiohttp resources are always closed.\n            async with aiohttp.ClientSession() as tts_session:\n                for _, text, voice, filename, rate, pitch in tts_files:\n                    try:\n                        communicator = edge_tts.Communicate(\n                            text, voice, rate=rate, pitch=pitch, session=tts_session\n                        )\n                        await communicator.save(filename)\n                    except Exception as e:\n                        print(f"❌ สร้าง TTS ไม่สำเร็จ ({_}): {e}")\n'''
          new_tts = '''            # edge-tts 7.x manages its own HTTP session.\n            # Do NOT pass session=... to Communicate().\n            for _, text, voice, filename, rate, pitch in tts_files:\n                try:\n                    communicator = edge_tts.Communicate(\n                        text, voice, rate=rate, pitch=pitch\n                    )\n                    await communicator.save(filename)\n                except Exception as e:\n                    print(f"❌ สร้าง TTS ไม่สำเร็จ ({_}): {e}")\n'''
          if old_tts not in s:
              raise SystemExit('bot.py edge-tts block not found')
          s = s.replace(old_tts, new_tts, 1)
          p.write_text(s, encoding='utf-8')

          # start.py: log the three existing notification loops after startup.
          p = Path('start.py')
          s = p.read_text(encoding='utf-8')
          marker = '''        if hasattr(bot_module, "start_voice_watchdog"):\n            await bot_module.start_voice_watchdog()\n'''
          replacement = '''        if hasattr(bot_module, "start_voice_watchdog"):\n            await bot_module.start_voice_watchdog()\n        log("🔎 Notification tasks: " + ", ".join(\n            f"{name}={getattr(getattr(bot_module, name, None), 'is_running', lambda: False)()}"\n            for name in (\n                "check_boss_notifications",\n                "check_bf_notifications",\n                "check_library_boss_notifications",\n            )\n        ))\n'''
          if marker not in s:
              raise SystemExit('start.py startup marker not found')
          if '🔎 Notification tasks:' not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          print('notification reliability patch prepared')
          PY

      - name: Validate Python syntax
        run: python -m py_compile bot.py start.py voice_patch.py

      - name: Commit source patch and remove one-time workflows
        run: |
          git config user.name "Iahcatan"
          git config user.email "307479640+Iahcatan@users.noreply.github.com"
          git add bot.py start.py voice_patch.py
          git rm .github/workflows/repair-voice-tts.yml .github/workflows/patch-notification-reliability.yml || true
          git diff --cached --check
          git commit -m "fix: harden boss notification loops and TTS playback" || exit 0
          git push
